spring:
  main:
    banner-mode: "off"

routing:
  connect-timeout: 500ms
  read-timeout: 2s

resilience4j:
  retry:
    instances:
      osrm:
        max-attempts: 3
        wait-duration: 20ms
        enable-exponential-backoff: false
        retry-exceptions:
          - com.logistics.routing.domain.route.exception.RoutingEngineUnavailableException
  circuitbreaker:
    instances:
      osrm:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: false
        record-exceptions:
          - com.logistics.routing.domain.route.exception.RoutingEngineException
