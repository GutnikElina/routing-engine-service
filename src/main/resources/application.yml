spring:
  application:
    name: routing-engine-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/routing}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      pool-name: routing-engine-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      auto-commit: false
      schema: routing
      connection-init-sql: SET search_path TO routing, public
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: routing
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        format_sql: true
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: routing
    default-schema: routing
datasource-proxy:
  logging: slf4j
  query:
    enable-logging: false
    log-level: debug
  slow-query:
    enable-logging: false
    threshold: 5000

server:
  port: ${SERVER_PORT:8082}

routing:
  max-coordinates: ${ROUTING_MAX_COORDINATES:100}
  route-overview: ${ROUTING_ROUTE_OVERVIEW:simplified}
  connect-timeout: 2s
  read-timeout: 15s
  osrm-base-urls:
    TRUCK: ${OSRM_TRUCK_URL:${OSRM_BASE_URL:http://localhost:5000}}
    TRAIN: ${OSRM_TRAIN_URL:http://localhost:5001}
    VESSEL: ${OSRM_VESSEL_URL:http://localhost:5002}
  plane-average-speed-kmh: ${PLANE_AVERAGE_SPEED_KMH:800}
