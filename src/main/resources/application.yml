spring:
  application:
    name: routing-engine-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/routing?currentSchema=routing}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      pool-name: routing-engine-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: routing
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        format_sql: true
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: routing
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      client-id: ${spring.application.name}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        spring.json.add.type.headers: false

datasource-proxy:
  logging: slf4j
  query:
    enable-logging: false
    log-level: debug
  slow-query:
    enable-logging: false
    threshold: 5000

server:
  port: ${SERVER_PORT:8082}

outbox:
  publisher:
    fixed-delay: ${OUTBOX_PUBLISHER_FIXED_DELAY:1000}
    batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:10}

messaging:
  kafka:
    topics:
      route-order-events: ${ROUTE_ORDER_EVENTS_TOPIC:routing.route-order-events.v1}
